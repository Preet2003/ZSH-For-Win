ShortDescription: Oh My Zsh-style developer experience for Windows PowerShell
Description: |-
  WinZSH is a Windows developer experience layer for PowerShell (not a new shell).

  Install by downloading WinZSH-Setup-x86_64.exe from GitHub Releases and running it,
  or via winget. Setup copies winzsh to your user profile, adds PATH, and wires the
  PowerShell profile hook.

  After setup, open a new PowerShell tab and run:
    zsh-for-win
